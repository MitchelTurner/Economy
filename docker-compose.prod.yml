# Full stack for local smoke / compose deploy (not a substitute for managed Railway DB).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: island
      POSTGRES_PASSWORD: island
      POSTGRES_DB: island_ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U island -d island_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/island-ledger-receipts || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://island:island@postgres:5432/island_ledger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: compose-dev-access-secret-32chars
      JWT_REFRESH_SECRET: compose-dev-refresh-secret-32c
      CORS_ORIGIN: http://localhost:8080
      # nginx sets X-Forwarded-For; honor one proxy hop for rate-limit client IP
      TRUST_PROXY: "1"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: island-ledger-receipts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      EXTRACTION_PROVIDER: mock
      ALLOW_MOCK_EXTRACTION: "true"
      API_PORT: "3000"
      # One-shot: set to reference (or demo) for first boot, then leave off.
      SEED_ON_BOOT: "off"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      PORT: "80"
      # host:port for nginx variable proxy (see apps/web/nginx.conf.template)
      API_UPSTREAM: api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata:
