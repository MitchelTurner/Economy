# Default config for the API service (Railpack).
# Web MUST be a second Railway service with Builder=Dockerfile (see DEPLOY.md).
# Do not point the web service at Railpack — this file would build the API again.

[build]
builder = "RAILPACK"
buildCommand = "npm run build --workspace=@island-ledger/api"

[deploy]
startCommand = "npm run start --workspace=@island-ledger/api"
# Liveness only — /health/ready also needs Redis and will 503 if Redis is missing.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
